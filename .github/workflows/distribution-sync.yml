name: sync-distribution

# The packages are AUTHORED here — generated from the atlas preset by scripts/distribution.mjs — and
# INSTALLED from a thin repository. Both hosts that carry a marketplace clone the whole repository they are
# pointed at: measured on this one, `claude plugin marketplace add <owner/repo>` fetches 33M and 1605 files
# for a skill that is four. So the marketplace lives in a repository that holds nothing else, and this job
# is what keeps it equal to `distribution/`. It runs only when `distribution/` actually changed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'distribution/**'

jobs:
  sync:
    # Set the variable when the mirror repository exists and the token is installed; until then the job is a
    # no-op rather than a red X on every push.
    if: vars.SPEXCODE_DISTRIBUTION_SYNC == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: distribution-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install workspace dependencies
        run: npm ci

      # The mirror must never be a snapshot of a hand-edit. `--check` regenerates every package and fails if
      # what is committed differs, so what gets published is what the generator says.
      - name: The committed packages are what the generator writes
        run: node scripts/distribution.mjs --check

      # A marketplace root without its manifest is a directory neither host can install from — the exact
      # failure this mirror exists to prevent, so it is a gate rather than a hope.
      - name: Both marketplace manifests are present
        run: |
          set -euo pipefail
          test -f distribution/.claude-plugin/marketplace.json
          test -f distribution/.agents/plugins/marketplace.json
          node -e "JSON.parse(require('fs').readFileSync('distribution/.claude-plugin/marketplace.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('distribution/.agents/plugins/marketplace.json','utf8'))"

      # A DEPLOY KEY, not an account token. The only thing this job may do outside this repository is push one
      # mirror, and a deploy key is scoped to exactly that repository — an account token in CI could write to
      # everything the account owns, for a job whose whole purpose is to copy four files.
      - name: Mirror distribution/ into the plugins repository
        env:
          MIRROR_REPO: ${{ vars.SPEXCODE_DISTRIBUTION_REPO }}
          MIRROR_KEY: ${{ secrets.SPEXCODE_DISTRIBUTION_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MIRROR_REPO:-}" ] || [ -z "${MIRROR_KEY:-}" ]; then
            echo "SPEXCODE_DISTRIBUTION_REPO / SPEXCODE_DISTRIBUTION_KEY are not configured" >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$MIRROR_KEY" > ~/.ssh/mirror_key
          chmod 600 ~/.ssh/mirror_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes"
          git clone --depth 1 "git@github.com:${MIRROR_REPO}.git" mirror
          # Replace the tree wholesale so a package deleted here disappears there; the mirror owns nothing of
          # its own except its git history.
          find mirror -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -a distribution/. mirror/
          cd mirror
          git config user.name "spexcode-bot"
          git config user.email "bot@spexcode.net"
          git add -A
          if git diff --cached --quiet; then
            echo "mirror already equals distribution/ at ${GITHUB_SHA}"
            exit 0
          fi
          # The message names the commit this tree came from: the mirror has no history of its own to read.
          git commit -q -m "sync distribution/ from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push -q origin HEAD
          echo "mirrored ${GITHUB_SHA} to ${MIRROR_REPO}"
